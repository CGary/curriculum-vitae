<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CV of Cristian Gary Nuñez Jimenez — Senior Software Engineer and Frontend Tech Lead with over a decade of experience in industrial systems, SaaS products, and legacy code refactoring."
    />
    <title>
      Cristian Gary Nuñez Jimenez — Senior Software Engineer & Frontend Tech
      Lead
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #1a1a1a;
        --muted: #555;
        --soft: #6b6b6b;
        --accent: #2c5aa0;
        --rule: #d8dde3;
        --bg: #ffffff;
        --page-bg: #f3f4f6;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;
        font-size: 11pt;
        line-height: 1.5;
        color: var(--ink);
        background: var(--page-bg);
        padding: 2rem 1rem;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        max-width: 820px;
        margin: 0 auto;
        background: var(--bg);
        padding: 2.75rem 3rem;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.07);
        border-radius: 4px;
      }

      a {
        color: var(--accent);
        text-decoration: none;
        border-bottom: 1px solid transparent;
        transition: border-color 0.15s ease;
      }

      a:hover {
        border-bottom-color: var(--accent);
      }

      h1,
      h2,
      h3 {
        margin: 0;
        color: var(--ink);
      }

      h1 {
        font-size: 22pt;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }

      .role-title {
        font-size: 12pt;
        font-weight: 500;
        color: var(--accent);
        margin: 0.15rem 0 0.6rem;
      }

      .contact {
        font-size: 9.75pt;
        color: var(--muted);
        line-height: 1.65;
        margin: 0;
      }

      .contact a {
        color: inherit;
      }

      .contact .sep {
        margin: 0 0.45rem;
        color: var(--rule);
      }

      h2 {
        font-size: 10.5pt;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--accent);
        margin: 1.4rem 0 0.55rem;
        padding-bottom: 0.2rem;
        border-bottom: 1.5px solid var(--accent);
      }

      section {
        margin-bottom: 0.4rem;
      }

      .summary {
        text-align: justify;
        margin: 0;
        color: var(--ink);
      }

      .role-block {
        margin-bottom: 0.95rem;
      }

      .role-block .head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 0.4rem 1rem;
        margin-bottom: 0.1rem;
      }

      .role-block h3 {
        font-size: 11pt;
        font-weight: 700;
      }

      .role-block .company {
        color: var(--accent);
        font-weight: 600;
      }

      .role-block .meta {
        font-size: 9.5pt;
        color: var(--soft);
        font-style: italic;
        white-space: nowrap;
      }

      .role-block .progression {
        font-size: 9.75pt;
        color: var(--soft);
        margin: 0.05rem 0 0.3rem;
      }

      .role-block ul {
        margin: 0.2rem 0 0.3rem 1.1rem;
        padding: 0;
      }

      .role-block li {
        margin-bottom: 0.22rem;
        padding: 0;
        list-style: disc;
        text-align: justify;
      }

      .role-block .stack {
        font-size: 9.5pt;
        color: var(--soft);
        margin: 0.15rem 0 0;
      }

      .role-block .stack strong {
        color: var(--ink);
        font-weight: 600;
      }

      dl.skills {
        display: grid;
        grid-template-columns: 175px 1fr;
        gap: 0.35rem 1rem;
        margin: 0;
      }

      dl.skills dt {
        font-weight: 600;
        color: var(--ink);
      }

      dl.skills dd {
        margin: 0;
        color: var(--muted);
      }

      .edu-block {
        margin-bottom: 0.55rem;
      }

      .edu-block .head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .edu-block h3 {
        font-size: 10.5pt;
        font-weight: 700;
      }

      .edu-block .institution {
        color: var(--accent);
        font-weight: 500;
      }

      .edu-block .meta {
        font-size: 9.5pt;
        color: var(--soft);
        font-style: italic;
      }

      .edu-block .detail {
        font-size: 9.75pt;
        color: var(--muted);
        margin: 0.1rem 0 0;
      }

      .languages {
        display: flex;
        flex-wrap: wrap;
        gap: 1.5rem;
        margin: 0;
      }

      .languages .item strong {
        font-weight: 600;
      }

      .languages .item span {
        color: var(--muted);
      }

      @media print {
        @page {
          size: A4;
          margin: 1.1cm 1.4cm;
        }

        html,
        body {
          background: #ffffff;
          color: #000000;
          font-size: 9.5pt;
          line-height: 1.4;
          padding: 0;
        }

        .page {
          max-width: none;
          margin: 0;
          padding: 0;
          box-shadow: none;
          border-radius: 0;
          background: #ffffff;
        }

        a {
          color: inherit !important;
          border: 0 !important;
          text-decoration: none !important;
        }

        h1 {
          font-size: 18pt;
        }

        .role-title {
          font-size: 10.5pt;
          margin-bottom: 0.35rem;
        }

        .contact {
          font-size: 9pt;
          line-height: 1.5;
        }

        h2 {
          font-size: 9.5pt;
          margin: 0.7rem 0 0.3rem;
          padding-bottom: 0.12rem;
          border-bottom-width: 1px;
          color: #000;
          border-color: #000;
        }

        .role-block,
        .edu-block,
        section {
          page-break-inside: avoid;
        }

        .role-block {
          margin-bottom: 0.5rem;
        }

        .role-block h3,
        .edu-block h3 {
          font-size: 9.75pt;
        }

        .role-block .company,
        .edu-block .institution {
          color: #000;
        }

        .role-block li {
          margin-bottom: 0.1rem;
        }

        .role-block .stack,
        .role-block .progression,
        .role-block .meta,
        .edu-block .meta,
        .edu-block .detail {
          color: #333;
          font-size: 8.75pt;
        }

        dl.skills {
          grid-template-columns: 145px 1fr;
          gap: 0.2rem 0.8rem;
        }

        .summary {
          font-size: 9.5pt;
        }
      }
    </style>
    <script src="https://unpkg.com/preact@10.19.2/dist/preact.umd.js"></script>
    <script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
  </head>
  <body>
    <main class="page" id="cv-content"></main>

    <script type="module">
      const cvData = {
        personal: {
          nombre: "Cristian Gary Nuñez Jimenez",
          titulo: "Senior Software Engineer · Tech Lead",
          ubicacion: "Santa Cruz de la Sierra, Bolivia",
          email: "cristiangnj@gmail.com",
          telefono: "+591 76641121",
          github: {
            url: "https://github.com/CGary",
            label: "github.com/CGary",
          },
          linkedin: {
            url: "https://www.linkedin.com/in/cristian-gary-nj",
            label: "linkedin.com/in/cristian-gary-nj",
          },
        },
        resumen:
          "Senior Software Engineer with nearly two decades of experience, currently serving as a Software Engineer in the Technology team at tuGerente. My career combines eleven years of integrating industrial systems (SCADA iFIX, Modbus drivers, and web applications for the oil and gas supply chain) with four recent years where I scaled from Software Engineer L1 to L4 (Senior), leading the architectural modernization and technical transformation of tuGerente's SaaS product. My differentiator in 2026 is the disciplined integration of AI models into software development. Self-taught by conviction: I translate technical curiosity into defensible engineering decisions for the business.",
        experiencia: [
          {
            puesto: "Software Engineer",
            empresa: "tuGerente",
            periodo: "Dec 2021 – Present",
            ubicacion: "Santa Cruz, Bolivia · Remote",
            progresion:
              "Progression: Full Stack Developer (L1) → Senior Frontend Engineer (L2) → Frontend Team Technical Lead (L3) → Senior Software Engineer (L4).",
            logros: [
              "Technically lead the Technology team, conducting code reviews, release planning, and the disciplined integration of AI models into the software development lifecycle.",
              "Driven the comprehensive evolution of the SaaS product by transforming its legacy architecture into a scalable system. This direct impact on software stability and team productivity was the foundation for my promotion from Engineer L1 to L4.",
              "Design and implementation of CI/CD architectures for automated frontend application deployment using AWS S3 and CloudFront.",
              "Modernized legacy code by replacing global SCSS architecture with CSS Modules, eliminating visual collisions without massive refactors. Standardized software quality through selective TypeScript adoption and automation of linters, logic validations, and testing (Jest, Playwright) in GitLab CI/CD pipelines, consolidating faster and safer continuous deployments."
            ],
            stack:
              "Go, Python (Django), TypeScript, React, Svelte 5, PostgreSQL, AWS (Fargate, CloudFront, S3, ECS), GitLab CI/CD, Docker, Sentry",
          },
          {
            puesto: "Software Developer",
            empresa: "Consultora Prosur SRL",
            periodo: "Nov 2010 – Nov 2021",
            ubicacion: "Santa Cruz, Bolivia",
            logros: [
              "Development and implementation of a web system for natural gas measurement validation and reconciliation, applying calculation algorithms based on AGA 7 and AGA 8 standards.",
              "Built web-based visualization and telemetry systems for gas measurements, integrating field hardware with industrial backends in operations across the Bolivian energy chain.",
              "Developed Modbus communication drivers for measurement devices, ensuring data fidelity in critical oil and gas industry workflows.",
              "Served as the lead for the SCADA iFIX system, maintaining observability and continuity for critical industrial operations.",
              "Provisioned network infrastructure, router configuration, and structured cabling for industrial clients, complementing the software role with operations responsibilities.",
            ],
            stack:
              "C#, ASP.NET, MS SQL Server, T-SQL, JavaScript, jQuery, SCADA iFIX, Modbus, Industrial Automation",
          },
          {
            puesto: "Systems Intern",
            empresa: "Transierra SA",
            periodo: "Feb 2009 – Oct 2009",
            ubicacion: "Santa Cruz, Bolivia",
            logros: [
              "Developed the internal operational news system and participated in the maintenance of corporate server infrastructure.",
            ],
          },
        ],
        habilidades: [
          {
            categoria: "Frontend",
            valores:
              "Svelte 5 ($props, runes) · React.js · Redux · TypeScript · JavaScript · HTML5 · CSS · Styled-Components · Webpack · Babel",
          },
          {
            categoria: "Testing & Quality",
            valores: "Jest · Playwright · ESLint · Sentry · Code reviews",
          },
          {
            categoria: "Backend",
            valores:
              "Go · Python (Django) · Node.js · Express.js · ASP.NET · PHP",
          },
          {
            categoria: "Databases",
            valores: "PostgreSQL · MS SQL Server · T-SQL · MySQL · Firebase",
          },
          {
            categoria: "DevOps & Infra",
            valores:
              "AWS (Fargate, CloudFront, S3, ECS) · Docker · Git · GitHub · GitLab CI/CD · Linux (Arch/CachyOS, Debian) · Nginx",
          },
          {
            categoria: "Architecture & Methods",
            valores:
              "Hexagonal Architecture · Spec-Driven Development (SDD) · Behavior-Driven Development (BDD) · Functional Programming · RAG (Retrieval-Augmented Generation)",
          },
          {
            categoria: "AI applied to Dev cycle",
            valores:
              "Coding Agents (Claude Code, Gemini CLI, Codex CLI, OpenCode, Qwen CLI) · Local LLMs (Ollama) · Custom Go tooling for context management (Hybrid Semantic Memory Engine)",
          },
          {
            categoria: "Industrial Systems",
            valores:
              "AGA 7/8 Standards · SCADA iFIX · Modbus · Industrial Automation",
          },
          {
            categoria: "Leadership",
            valores:
              "Team Leadership · Project Management · Technical Mentorship · 'Building in Public' strategies",
          },
          {
            categoria: "Additional Languages",
            valores: "C# · Java · C++ · Pascal",
          },
          {
            categoria: "Mobile (Hybrid)",
            valores: "Apache Cordova · Ionic Framework · PhoneGap",
          },
        ],
        educacion: [
          {
            titulo: "Systems Engineering",
            institucion:
              "Universidad Tecnológica Privada de Santa Cruz (UTEPSA)",
            periodo: "2004 – 2010",
            detalle:
              "Member of the OVERFLOW team representing the university in ACM-ICPC 2008 and 2009.",
          },
          {
            titulo: "Web Development Specialization",
            institucion: "Platzi",
            periodo: "2019 – 2021",
            detalle:
              "Courses: React.js, Advanced React, CSS Grid Layout, HTML & CSS, Webpack, Professional Git & GitHub.",
          },
          {
            titulo: "Initial Engineering Studies",
            institucion: "Universidad Autónoma Gabriel René Moreno (UAGRM)",
            periodo: "2003 – 2004",
          },
        ],
        idiomas: [
          { idioma: "Spanish", nivel: "Native" },
          { idioma: "English", nivel: "Technical Reading" },
        ],
      };

      const { h, render } = window.preact;
      const html = window.htm.bind(h);

      function Header({ personal }) {
        return html`
          <section>
            <h1>${personal.nombre}</h1>
            <p class="role-title">${personal.titulo}</p>
            <p class="contact">
              ${personal.ubicacion}<span class="sep">·</span>
              <a href=${"mailto:" + personal.email}>${personal.email}</a>
              <span class="sep">·</span> ${personal.telefono}
              <br />
              <a href=${personal.linkedin.url} target="_blank" rel="noopener"
                >${personal.linkedin.label}</a
              >
              <span class="sep">·</span>
              <a href=${personal.github.url} target="_blank" rel="noopener"
                >${personal.github.label}</a
              >
            </p>
          </section>
        `;
      }

      function Resumen({ resumen }) {
        return html`
          <section>
            <h2>Professional Profile</h2>
            <p class="summary">${resumen}</p>
          </section>
        `;
      }

      function Experiencia({ experiencia }) {
        return html`
          <section>
            <h2>Professional Experience</h2>
            ${experiencia.map(
              (exp) => html`
                <article class="role-block">
                  <div class="head">
                    <h3>
                      ${exp.puesto}
                      <span class="company"> · ${exp.empresa}</span>
                    </h3>
                    <span class="meta"
                      >${exp.periodo}${exp.ubicacion
                        ? html` · ${exp.ubicacion}`
                        : null}</span
                    >
                  </div>
                  ${exp.progresion
                    ? html`<p class="progression">${exp.progresion}</p>`
                    : null}
                  <ul>
                    ${exp.logros.map((l) => html`<li>${l}</li>`)}
                  </ul>
                  ${exp.stack
                    ? html`<p class="stack">
                        <strong>Stack:</strong> ${exp.stack}
                      </p>`
                    : null}
                </article>
              `,
            )}
          </section>
        `;
      }

      function Habilidades({ habilidades }) {
        return html`
          <section>
            <h2>Technical Skills</h2>
            <dl class="skills">
              ${habilidades.map(
                (h) => html`
                  <dt>${h.categoria}</dt>
                  <dd>${h.valores}</dd>
                `,
              )}
            </dl>
          </section>
        `;
      }

      function Educacion({ educacion }) {
        return html`
          <section>
            <h2>Education</h2>
            ${educacion.map(
              (e) => html`
                <article class="edu-block">
                  <div class="head">
                    <h3>
                      ${e.titulo}
                      <span class="institution"> · ${e.institucion}</span>
                    </h3>
                    <span class="meta">${e.periodo}</span>
                  </div>
                  ${e.detail ? html`<p class="detail">${e.detail}</p>` : null}
                </article>
              `,
            )}
          </section>
        `;
      }

      function Idiomas({ idiomas }) {
        return html`
          <section>
            <h2>Languages</h2>
            <p class="languages">
              ${idiomas.map(
                (i) => html`
                  <span class="item"
                    ><strong>${i.idioma}</strong> —
                    <span>${i.nivel}</span></span
                  >
                `,
              )}
            </p>
          </section>
        `;
      }

      function CV({ data }) {
        return html`
          <${Header} personal=${data.personal} />
          <${Resumen} resumen=${data.resumen} />
          <${Experiencia} experiencia=${data.experiencia} />
          <${Habilidades} habilidades=${data.habilidades} />
          <${Educacion} educacion=${data.educacion} />
          <${Idiomas} idiomas=${data.idiomas} />
        `;
      }

      render(
        html`<${CV} data=${cvData} />`,
        document.getElementById("cv-content"),
      );
    </script>
  </body>
</html>
